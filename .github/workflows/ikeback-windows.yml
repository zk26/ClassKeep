name: ikeback Windows Build

# Produces real Windows binaries (teacher + student + classroom.dll) using
# MSYS2 UCRT64 / Qt6 / MinGW-w64, i.e. the toolchain Veyon's CMake requires.
#
# UCRT64 is mandatory: MSYS2 ships QCA and LibVNC only for ucrt64/clang64,
# not for mingw64. `windows-binaries` from upstream WindowsInstaller.cmake is
# NOT used here - it hardcodes Linux cross-compiler paths (/usr/lib/gcc/...)
# and runs a full build that hits the broken upstream filetransfer plugin.
# We build explicit targets and collect the DLLs ourselves.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ikeback-windows.yml'
      # Windows-only code paths (DPAPI, registry, WTS sessions, Logger) are not
      # compiled by the Linux job, so any tree change needs this build as well.
      - 'desktop/**'
      - 'mobile/**'

permissions:
  contents: read

jobs:
  windows:
    name: Compile Windows binaries (UCRT64 / Qt6 / MinGW)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-httpserver
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qca-qt6
            mingw-w64-ucrt-x86_64-libvncserver
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-lzo2
            mingw-w64-ucrt-x86_64-openldap
            mingw-w64-ucrt-x86_64-cyrus-sasl
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-python

      - name: Fetch Veyon 3rdparty sources (pinned to v4.11.4)
        shell: bash
        run: |
          set -e
          base=desktop/3rdparty
          mkdir -p "$base"
          fetch() {
            name=$1; url=$2; sha=$3
            if [ -d "$base/$name/.git" ]; then return 0; fi
            git init -q "$base/$name"
            git -C "$base/$name" remote add origin "$url"
            git -C "$base/$name" fetch -q --depth 1 origin "$sha" \
              || git -C "$base/$name" fetch -q origin "$sha"
            git -C "$base/$name" checkout -q FETCH_HEAD
          }
          fetch libvncserver https://github.com/veyon/libvncserver.git 30860286c0f55674a846df9cab458da9afd1735b
          fetch ultravnc     https://github.com/veyon/ultravnc.git      479a32b8d7f929b6a0eb5730a678f3c812c8be0a
          fetch kldap        https://invent.kde.org/pim/kldap.git      2002b2c4ec81d05eb0fc5b2106ef112d404f5cea
          fetch qthttpserver https://github.com/veyon/qthttpserver.git  f80feff79a3d698ca3f23cfa240bd763d87cf0ba
          fetch libfakekey   https://github.com/veyon/libfakekey.git    7ad885912efb2131e80914e964d5e635b0d07b40

      # The pinned UltraVNC tree assumes __FUNCTION__ is a string literal, which
      # current GCC no longer guarantees: VNCLOG() then fails with "expected ')'
      # before string constant" and blocks the mandatory windows-platform plugin.
      # Patch that single macro instead of forking the third-party sources.
      - name: Patch pinned UltraVNC logging macro
        shell: bash
        run: |
          set -e
          # VNCLOG() concatenates __FUNCTION__, which current GCC makes a
          # pointer instead of a string literal. Several UltraVNC files define
          # their own copy (stdhdrs.h, benchmark.cpp, ...), so rewrite every
          # definition to a plain pass-through.
          find desktop/3rdparty/ultravnc/winvnc -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
            -exec perl -0pi -e 's/#define\s+VNCLOG\(s\)[^\n]*/#define VNCLOG(s) (s)/g' {} + || true
          grep -rn 'define VNCLOG' desktop/3rdparty/ultravnc/winvnc/ | head -8 | while IFS= read -r line; do
            echo "::notice::VNCLOG ${line}"
          done || true
          # The Windows headers only declare the legacy GWL_* accessors for
          # WINVER < 0x0500; this project targets 0x0602, so rewrite them in the
          # third-party sources (a compile definition is not enough because the
          # winuser.h block is #if'd out entirely).
          find desktop/3rdparty/ultravnc -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
            -exec perl -pi -e 's/\bGWL_WNDPROC\b/GWLP_WNDPROC/g; s/\bGWL_HINSTANCE\b/GWLP_HINSTANCE/g; s/\bGWL_ID\b/GWLP_ID/g; s/\bGWL_USERDATA\b/GWLP_USERDATA/g; s/DWL_MSGRESULT/DWLP_MSGRESULT/g; s/DWL_DLGPROC/DWLP_DLGPROC/g; s/DWL_USER/DWLP_USER/g' {} + || true
          # SettingsManager.h inside this tree is ANSI-only (TCHAR-based accessors
          # returning char*). The defines can only be cancelled before any
          # include, i.e. at the very top of the translation unit.
          k=desktop/3rdparty/ultravnc/winvnc/winvnc/vnckeymap.cpp
          sed -i '1i #undef UNICODE\n#undef _UNICODE' "$k"
          # vnckeymap.cpp logs through VNCLog and triggers vncCad, whose
          # implementations live in translators we do not build. Turning the
          # calls into void expressions keeps the surrounding statements (and
          # any if/else) syntactically intact while dropping the dependency.
          perl -0pi -e 's/vnclog\.Print\([^;]*\);/(void)0;/gs' "$k"
          # The global SettingsManager pointer is only defined by translators we
          # do not build; vnckeymap.cpp only asks whether we run inside the
          # external service, and ikeback's worker always does not.
          perl -0pi -e 's/settings->RunningFromExternalService\(\)/false/gs' "$k"
          grep -c 'vnclog\.Print\|RunningFromExternalService' "$k" || true

      - name: Configure
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake -S desktop -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=/ucrt64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QT6=ON \
            -DWITH_BUNDLED_LIBVNC=ON \
            -DWITH_WEBAPI=OFF \
            -DWITH_TRANSLATIONS=OFF \
            -DWITH_LTO=OFF \
            -DWITH_PCH=OFF \
            -DWITH_UNITY_BUILD=OFF \
            -DWITH_STACK_PROTECTION=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_CORE_ONLY=OFF \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DCMAKE_CXX_FLAGS="-include cmath" 2>&1 | tee configure.log

      # Build exactly what we ship. classroom pulls in ikeback-core, so all
      # Windows-only code (UWF / Core Audio / WFP / SetupAPI) is compiled here.
      # All Ikeback executables only link ikeback-core; plugins are loaded at
      # runtime, so we do NOT need a full build (which would hit the broken
      # upstream filetransfer plugin).
      - name: Build classroom plugin + Ikeback executables
        shell: msys2 {0}
        run: |
          set -o pipefail
          if ! cmake --build build --parallel 4 --target \
            classroom \
            ikeback-master ikeback-configurator ikeback-cli ikeback-wcli \
            ikeback-service ikeback-server ikeback-worker > build.log 2>&1; then
            cat build.log
            tail -n 12 build.log | while IFS= read -r line; do echo "::error::core|${line}"; done
            exit 1
          fi
          cat build.log

      # Build every usable upstream plugin so the installed Master/Service keep
      # demo, remote control, screen lock, VNC, etc. A full `cmake --build`
      # would hit the broken upstream filetransfer plugin, so compile targets
      # individually and skip only the ones that genuinely fail.
      # MANDATORY. IkebackCore::initPlatformPlugin() qFatal()s when no
      # `*-platform.dll` exists, which makes EVERY Ikeback executable die with
      # __fastfail at startup. Never allow this target to be silently skipped.
      - name: Build mandatory Windows platform plugin
        shell: msys2 {0}
        run: |
          set -o pipefail
          if cmake --build build --parallel 4 --target windows-platform > windows-platform.log 2>&1; then
            cat windows-platform.log
            exit 0
          fi
          cat windows-platform.log
          # Surface the real compiler errors as annotations: the job log itself
          # is not retrievable without authentication.
          errs=$(grep -E "error:|undefined reference" windows-platform.log | head -9)
          if [ -n "$errs" ]; then
            printf '%s\n' "$errs" | while IFS= read -r line; do echo "::error::${line}"; done
          else
            tail -n 9 windows-platform.log | while IFS= read -r line; do echo "::error::wp|${line}"; done
          fi
          exit 1

      # The real target for plugins/vncserver/ultravnc-builtin is
      # `builtin-ultravnc-server`; the previous list used the directory name,
      # so cmake silently reported "no rule to make target" and the VNC server
      # plugin was never built. Without it ikeback-server logs
      # "no VNC server plugins found" and exits, which leaves every student
      # unreachable - exactly the failure seen after installation.
      - name: Build other upstream plugins (best effort)
        shell: msys2 {0}
        run: |
          set -o pipefail
          for target in authkeys builtindirectory demo desktopservices ldap \
                        powercontrol remoteaccess screenlock screenshot \
                        systemusergroups textmessage usersessioncontrol \
                        external-vnc-server headless-vnc-server \
                        builtin-ultravnc-server vnchooks; do
            if cmake --build build --parallel 4 --target "$target" > /tmp/plugin-one.log 2>&1; then
              echo "built:   $target"
            else
              echo "skipped: $target"
              tail -n 12 /tmp/plugin-one.log || true
              if [ "$target" = "builtin-ultravnc-server" ]; then
                echo "::error::the VNC server plugin failed to build - ikeback-server cannot start without it"
                grep -E "error:|fatal error|FAILED:" /tmp/plugin-one.log | head -8 | while IFS= read -r line; do echo "::error::vs|${line}"; done || true
                tail -n 4 /tmp/plugin-one.log | while IFS= read -r line; do echo "::error::vs|tail|${line}"; done || true
                exit 1
              fi
            fi
          done
          ls -1 build/plugins/vncserver/ultravnc-builtin/*.dll 2>/dev/null || true

      # A hand-written DLL whitelist caused missing libbz2 / libmd4c / libbrotli
      # errors at runtime. collect_mingw_deps.py instead walks the real PE import
      # closure with ntldd until every runtime DLL is present.
      # The repo only ships .ts sources. Without compiled .qm files every
      # desktop window stays English even on a Chinese Windows install.
      - name: Build Simplified Chinese translations
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p translations
          LRELEASE="$(command -v lrelease || command -v lrelease-qt6 || true)"
          if [ -z "$LRELEASE" ]; then
            LRELEASE="$(find /ucrt64/bin -maxdepth 1 -name 'lrelease*' -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$LRELEASE" ]; then echo 'lrelease not found' >&2; exit 1; fi
          "$LRELEASE" desktop/translations/ikeback_zh_CN.ts -qm translations/ikeback_zh_CN.qm
          # Qt's own widgets (File / View / Help ...) need their zh_CN catalog too.
          find /ucrt64/share/qt6/translations -maxdepth 1 -name 'qt*_zh_CN.qm' -exec cp '{}' translations/ \; 2>/dev/null || true
          ls -lh translations

      - name: Assemble self-contained runtime payload
        shell: msys2 {0}
        run: bash desktop/scripts/collect-windows-runtime.sh

      - name: Build teacher and student setup EXEs
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist
          # Unicode true requires a UTF-8 BOM for the Chinese UI strings.
          { printf '\xEF\xBB\xBF'; cat desktop/scripts/ikeback-installer.nsi; } > installer.nsi
          # Version comes from the pushed tag (v5.2.0). Do NOT use `git describe`:
          # this repository still contains the inherited upstream Veyon tags.
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            [0-9]*) : ;;
            *) VERSION=5.2.1 ;;
          esac
          if ! makensis -DVERSION="$VERSION" -DROLE=teacher installer.nsi > nsis.log 2>&1; then
            cat nsis.log
            tail -n 10 nsis.log | while IFS= read -r line; do echo "::error::nsis|$line"; done
            ls -1 payload | head -30
            exit 1
          fi
          cat nsis.log
          makensis -DVERSION="$VERSION" -DROLE=student installer.nsi
          ls -lh dist

      - uses: actions/upload-artifact@v6
        with:
          name: ikeback-windows-setups
          path: dist/*.exe
          if-no-files-found: error

name: Purge releases older than 5.2.0

# 5.2.0 is the first official ikeback release. Everything published before it
# carries the retired product name and the packages that could not connect, so
# neither the release nor its tag should stay around.
#
# Talks to the REST API directly (the bundled gh CLI failed silently here).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/purge-old-releases.yml'

permissions:
  contents: write

jobs:
  purge:
    name: Delete obsolete releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete every release older than 5.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = "https://api.github.com/repos/" + repo

          def call(url, method="GET"):
              request = urllib.request.Request(url, method=method)
              request.add_header("Authorization", "Bearer " + token)
              request.add_header("Accept", "application/vnd.github+json")
              with urllib.request.urlopen(request) as response:
                  return response.read()

          def try_call(url, method):
              try:
                  call(url, method)
                  return True
              except urllib.error.HTTPError as error:
                  print("  ", method, url, "failed:", error.code)
                  return False

          for release in json.loads(call(base + "/releases?per_page=100")):
              tag = release["tag_name"]
              version = tag[1:] if tag.startswith("v") else tag
              major = version.split(".")[0]
              if not major.isdigit():
                  print("skip  ", tag, "(not a numeric version)")
                  continue
              if int(major) >= 5:
                  print("keep  ", tag, release["name"])
                  continue
              print("delete", tag, release["name"])
              try_call(base + "/releases/" + str(release["id"]), "DELETE")
              try_call(base + "/git/refs/tags/" + tag, "DELETE")

          print("--- remaining ---")
          for release in json.loads(call(base + "/releases?per_page=100")):
              print(release["tag_name"], release["name"])
          PY

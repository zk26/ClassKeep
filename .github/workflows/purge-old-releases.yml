name: Purge releases older than 5.2.0

# 5.2.0 is the first official ikeback release. Everything published before it
# carries the retired product name and the packages that could not connect, so
# it must not stay downloadable. Runs on demand or when this file changes.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/purge-old-releases.yml'

permissions:
  contents: write

jobs:
  purge:
    name: Delete obsolete releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete every release older than 5.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release list --limit 200 --json tagName --jq '.[].tagName' > /tmp/releases.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            version="${tag#v}"
            major="${version%%.*}"
            case "$major" in
              ''|*[!0-9]*)
                echo "skip   $tag (not a numeric version)"
                continue
                ;;
            esac
            if [ "$major" -lt 5 ]; then
              echo "delete $tag"
              gh release delete "$tag" --cleanup-tag --yes
            else
              echo "keep   $tag"
            fi
          done < /tmp/releases.txt
          echo "--- remaining ---"
          gh release list --limit 50

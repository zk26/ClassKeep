name: Purge releases older than 5.2.0

# 5.2.0 is the first official ikeback release. Everything published before it
# carries the retired product name and the packages that could not connect, so
# neither the release nor its tag should stay around.
#
# Uses curl + jq instead of the gh CLI (which failed silently on this runner).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/purge-old-releases.yml'

permissions:
  contents: write

jobs:
  purge:
    name: Delete obsolete releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete every release older than 5.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_TOKEN}"
          curl -sS -H "$auth" -H "Accept: application/vnd.github+json" \
            "$api/releases?per_page=100" -o /tmp/releases.json
          jq -r '.[] | "\(.id)\t\(.tag_name)"' /tmp/releases.json > /tmp/list.txt
          while IFS="$(printf '\t')" read -r id tag; do
            [ -n "$tag" ] || continue
            version="${tag#v}"
            major="${version%%.*}"
            case "$major" in
              ''|*[!0-9]*)
                echo "skip   $tag (not a numeric version)"
                continue
                ;;
            esac
            if [ "$major" -ge 5 ]; then
              echo "keep   $tag"
              continue
            fi
            echo "delete $tag"
            curl -sS -o /dev/null -w '  release -> %{http_code}\n' -X DELETE \
              -H "$auth" -H "Accept: application/vnd.github+json" "$api/releases/$id"
            curl -sS -o /dev/null -w '  tag     -> %{http_code}\n' -X DELETE \
              -H "$auth" -H "Accept: application/vnd.github+json" "$api/git/refs/tags/$tag" || true
          done < /tmp/list.txt
          echo "--- remaining ---"
          curl -sS -H "$auth" "$api/releases?per_page=100" | jq -r '.[] | "\(.tag_name)\t\(.name)"'

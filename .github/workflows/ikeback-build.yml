name: ikeback Build Check

# Real compilation of the C++/Qt desktop code and the Android app.
# See docs/IKEBACK-BUILD.md for the rationale and the Windows (MinGW) route.
#
# IMPORTANT: workflows must live at the REPOSITORY ROOT .github/workflows/.
# Files under veyon/.github/workflows/ are inert and never triggered.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ desktop
  desktop-linux:
    name: Compile desktop (Linux / Qt6 / GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Qt6 is MANDATORY: several upstream plugins (filetransfer) are Qt6-only
      # (QUuid completeness, QCoreApplication::setQuitOnLastWindowClosed).
      # The Qt5 route from the old Debian 11 CI fails on those files in 4.11.4.
      # MSVC is NOT an option: this CMake hardcodes GCC flags and its Windows
      # installer target needs a MinGW prefix. Package list matches upstream
      # .ci/linux.ubuntu.24.04/Dockerfile.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build git ca-certificates pkg-config \
            qt6-base-dev qt6-5compat-dev qt6-l10n-tools qt6-tools-dev \
            qt6-declarative-dev qt6-httpserver-dev qt6-websockets-dev \
            libqca-qt6-dev libqca-qt6-plugins \
            libssl-dev zlib1g-dev libjpeg-dev libpng-dev liblzo2-dev \
            libpam0g-dev libproc2-dev libldap2-dev libsasl2-dev \
            libfakekey-dev xorg-dev libvncserver-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      # The repository root has no .gitmodules (the Veyon tree is a subdirectory),
      # so actions/checkout with submodules:recursive cannot fetch these.
      # Pin every 3rdparty checkout to the exact gitlink recorded in upstream
      # veyon/veyon v4.11.4. Cloning HEAD pulls a different kldap revision and
      # breaks the build. Qt6 builds use `kldap`, Qt5 builds `kldap-qt5`.
      - name: Fetch Veyon 3rdparty sources (pinned to v4.11.4)
        run: |
          set -e
          base=veyon/3rdparty
          mkdir -p "$base"
          fetch() {
            name=$1; url=$2; sha=$3
            if [ -d "$base/$name/.git" ]; then return 0; fi
            git init -q "$base/$name"
            git -C "$base/$name" remote add origin "$url"
            git -C "$base/$name" fetch -q --depth 1 origin "$sha" \
              || git -C "$base/$name" fetch -q origin "$sha"
            git -C "$base/$name" checkout -q FETCH_HEAD
          }
          fetch libvncserver https://github.com/veyon/libvncserver.git 30860286c0f55674a846df9cab458da9afd1735b
          fetch x11vnc       https://github.com/veyon/x11vnc.git       c1e38369e2c601df7ab894c378df0cc2380a1ede
          fetch libfakekey   https://github.com/veyon/libfakekey.git    7ad885912efb2131e80914e964d5e635b0d07b40
          fetch kldap        https://invent.kde.org/pim/kldap.git      2002b2c4ec81d05eb0fc5b2106ef112d404f5cea

      - name: Configure
        run: |
          set -o pipefail
          cmake -S veyon -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_QT6=ON \
            -DWITH_BUNDLED_LIBVNC=ON \
            -DWITH_WEBAPI=OFF \
            -DWITH_TRANSLATIONS=OFF \
            -DWITH_LTO=OFF \
            -DWITH_PCH=OFF \
            -DWITH_UNITY_BUILD=OFF \
            -DWITH_STACK_PROTECTION=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_CORE_ONLY=OFF \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DCMAKE_CXX_FLAGS="-Wno-deprecated-enum-enum-conversion -include cmath" 2>&1 | tee configure.log

      # Build only the ikeback plugin target (plus everything it depends on:
      # veyon-core, Qt, etc.). Upstream plugins/filetransfer is broken in this
      # 4.11.4 snapshot under BOTH Qt5 and Qt6 (missing <QUuid> include,
      # qApp->setQuitOnLastWindowClosed on QCoreApplication); it is unrelated to
      # ikeback and would make every full-project build fail.
      - name: Build the ikeback plugin
        run: |
          set -o pipefail
          cmake --build build --target classroom --parallel 4 2>&1 | tee build.log

      - name: Verify the ikeback plugin was produced
        run: |
          set -e
          find build \( -name 'classroom*.so' -o -name 'classroom*.dll' \) -print | tee plugin-paths.txt
          test -s plugin-paths.txt || { echo 'classroom plugin was not built'; exit 1; }

      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ikeback-desktop-build-logs
          path: |
            configure.log
            build.log
            plugin-paths.txt
          if-no-files-found: warn

  # ------------------------------------------------------------------ Android
  android:
    name: Compile + test Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships an Android SDK already. Do NOT use setup-android@v3:
      # it tries to replace the preinstalled cmdline-tools with an older pinned
      # version and fails on `sdkmanager --licenses`. Let AGP auto-download the
      # platforms it needs after accepting licenses with the preinstalled tool.
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build and test
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Collect APK
        run: |
          APK=$(find mobile/app/build/outputs -name '*.apk' -type f | head -n 1)
          test -n "$APK" || { echo 'No APK produced'; exit 1; }
          cp "$APK" ikeback-Mobile.apk

      - uses: actions/upload-artifact@v6
        with:
          name: ikeback-mobile
          path: ikeback-Mobile.apk
          if-no-files-found: error

name: ClassKeep Release

# Publishes artifacts that can be built without a private toolchain:
#   - Android APK (real compiled binary)
#   - teacher/student deployment preset ZIPs (config, scripts, docs, licenses)
#   - SHA256SUMS.txt and release notes
#
# IMPORTANT: a FULL Windows binary package is NOT built here.
# Veyon's CMake hardcodes GCC/MinGW flags (-Wno-attributes, -fno-exceptions,
# -Wl,-no-undefined, -mwindows, -lws2_32) and its windows-binaries target needs
# a MinGW prefix with Qt6/QCA-Qt6/LibVNC DLLs. MSVC + vcpkg cannot build it.
# See docs/CLASSKEEP-BUILD.md for the MinGW-w64 route (self-hosted runner or
# local MSYS2). Once such a build exists, attach the two ZIPs to the Release.
#
# This file must stay at the REPOSITORY ROOT .github/workflows/ to be triggered.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ Android
  android:
    name: Android classroom app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships an Android SDK; setup-android@v3 replaces its
      # cmdline-tools with an older pinned version and fails on licenses.
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build and test
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Collect and version the APK
        shell: bash
        run: |
          set -e
          VERSION='${{ github.event.inputs.version }}'
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          APK=$(find mobile/app/build/outputs -name '*.apk' -type f | head -n 1)
          test -n "$APK" || { echo 'No APK produced'; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/ClassKeep-Mobile-$VERSION.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: classkeep-release-assets
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------ Presets
  presets:
    name: Teacher/student deployment presets
    needs: android
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: classkeep-release-assets
          path: dist

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrEmpty($v)) { $v = $env:GITHUB_REF_NAME -replace '^v', '' }
          if ([string]::IsNullOrEmpty($v)) { $v = '1.0.1' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build preset packages and checksums
        shell: pwsh
        run: |
          .\veyon\scripts\package-presets.ps1 -Version '${{ steps.ver.outputs.value }}' -OutputDir dist

      - name: Write release notes
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.value }}'
          $template = [IO.File]::ReadAllText('veyon/scripts/release-notes-template.md', [Text.Encoding]::UTF8)
          $notes = $template.Replace('{VER}', $v)
          [IO.File]::WriteAllText('dist/RELEASE-NOTES.md', $notes, (New-Object Text.UTF8Encoding($false)))

      - uses: actions/upload-artifact@v6
        with:
          name: classkeep-release-final
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------ Release
  release:
    name: Publish GitHub Release
    needs: presets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: classkeep-release-final
          path: dist

      - name: Verify artifacts and checksums
        shell: bash
        run: |
          set -e
          ls dist/ClassKeep-Teacher-*-preset.zip
          ls dist/ClassKeep-Student-*-preset.zip
          ls dist/ClassKeep-Mobile-*.apk
          ls dist/SHA256SUMS.txt
          cd dist
          while read -r hash file; do
            [ -z "$file" ] && continue
            echo "$hash  $file" | sha256sum -c -
          done < SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: 课守 ClassKeep ${{ github.ref_name }}
          body_path: dist/RELEASE-NOTES.md
          files: |
            dist/ClassKeep-Teacher-*-preset.zip
            dist/ClassKeep-Student-*-preset.zip
            dist/ClassKeep-Mobile-*.apk
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
          fail_on_unmatched_files: true

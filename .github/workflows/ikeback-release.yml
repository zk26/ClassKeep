name: ikeback Release

# Publishes THREE real, compiled artifacts on tag push / manual dispatch:
#   - Android APK                 (Ubuntu + JDK21 + Android SDK)
#   - Windows teacher ZIP         (MSYS2 UCRT64 + Qt6/MinGW)
#   - Windows student ZIP         (same binaries, different preset config)
# plus SHA256SUMS.txt and RELEASE-NOTES.md.
#
# Must live at the REPOSITORY ROOT .github/workflows/ to be triggered.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix (e.g. 5.2.0)'
        required: true
        default: '5.2.1'
      purge_old_releases:
        description: 'After publishing, delete every GitHub release older than 5.2.0'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ Android
  android:
    name: Android classroom app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu runners ship an Android SDK; setup-android@v3 replaces its
      # cmdline-tools with an older pinned version and fails on licenses.
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build and test
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -e
          APK=$(find mobile/app/build/outputs -name '*.apk' -type f | head -n 1)
          test -n "$APK" || { echo 'No APK produced'; exit 1; }
          mkdir -p dist
          cp "$APK" dist/ikeback-Mobile.apk

      - uses: actions/upload-artifact@v6
        with:
          name: ikeback-android
          path: dist/ikeback-Mobile.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows binaries (UCRT64 / Qt6 / MinGW)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-httpserver
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qca-qt6
            mingw-w64-ucrt-x86_64-libvncserver
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-lzo2
            mingw-w64-ucrt-x86_64-openldap
            mingw-w64-ucrt-x86_64-cyrus-sasl
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-python

      - name: Fetch Veyon 3rdparty sources (pinned to v4.11.4)
        shell: bash
        run: |
          set -e
          base=desktop/3rdparty
          mkdir -p "$base"
          fetch() {
            name=$1; url=$2; sha=$3
            if [ -d "$base/$name/.git" ]; then return 0; fi
            git init -q "$base/$name"
            git -C "$base/$name" remote add origin "$url"
            git -C "$base/$name" fetch -q --depth 1 origin "$sha" \
              || git -C "$base/$name" fetch -q origin "$sha"
            git -C "$base/$name" checkout -q FETCH_HEAD
          }
          fetch libvncserver https://github.com/veyon/libvncserver.git 30860286c0f55674a846df9cab458da9afd1735b
          fetch ultravnc     https://github.com/veyon/ultravnc.git      479a32b8d7f929b6a0eb5730a678f3c812c8be0a
          fetch kldap        https://invent.kde.org/pim/kldap.git      2002b2c4ec81d05eb0fc5b2106ef112d404f5cea
          fetch qthttpserver https://github.com/veyon/qthttpserver.git  f80feff79a3d698ca3f23cfa240bd763d87cf0ba
          fetch libfakekey   https://github.com/veyon/libfakekey.git    7ad885912efb2131e80914e964d5e635b0d07b40

      # The pinned UltraVNC tree no longer compiles with a current GCC/MinGW
      # toolchain: VNCLOG() concatenates __FUNCTION__ (now a pointer), the TCHAR
      # based accessors break under UNICODE, and two helpers live in translators
      # that are not part of the windows-platform target. Patch the tree once,
      # here, instead of forking the third-party sources. Keep this step in sync
      # with ikeback-windows.yml.
      - name: Patch pinned UltraVNC sources for the current toolchain
        shell: bash
        run: |
          set -e
          # VNCLOG() concatenates __FUNCTION__ (a pointer with current GCC) and
          # several UltraVNC files define their own copy, so rewrite them all.
          find desktop/3rdparty/ultravnc/winvnc -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
            -exec perl -0pi -e 's/#define\s+VNCLOG\(s\)[^\n]*/#define VNCLOG(s) (s)/g' {} + || true
          grep -rn 'define VNCLOG' desktop/3rdparty/ultravnc/winvnc/ | head -8 || true
          # GWL_* accessors are only declared for WINVER < 0x0500; rewrite them.
          find desktop/3rdparty/ultravnc -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
            -exec perl -pi -e 's/\bGWL_WNDPROC\b/GWLP_WNDPROC/g; s/\bGWL_HINSTANCE\b/GWLP_HINSTANCE/g; s/\bGWL_ID\b/GWLP_ID/g; s/\bGWL_STYLE\b/GWLP_STYLE/g; s/\bGWL_EXSTYLE\b/GWLP_EXSTYLE/g; s/\bGWL_USERDATA\b/GWLP_USERDATA/g' {} + || true
          k=desktop/3rdparty/ultravnc/winvnc/winvnc/vnckeymap.cpp
          sed -i '1i #undef UNICODE\n#undef _UNICODE' "$k"
          perl -0pi -e 's/vnclog\.Print\([^;]*\);/(void)0;/gs' "$k"
          perl -0pi -e 's/settings->RunningFromExternalService\(\)/false/gs' "$k"
          grep -c 'vnclog\.Print\|RunningFromExternalService' "$k" || true
          head -3 "$k"

      - name: Configure
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake -S desktop -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=/ucrt64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QT6=ON -DWITH_BUNDLED_LIBVNC=ON \
            -DWITH_WEBAPI=OFF -DWITH_TRANSLATIONS=OFF \
            -DWITH_LTO=OFF -DWITH_PCH=OFF -DWITH_UNITY_BUILD=OFF \
            -DWITH_STACK_PROTECTION=OFF -DWITH_TESTS=OFF -DWITH_CORE_ONLY=OFF \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DCMAKE_CXX_FLAGS="-include cmath" 2>&1 | tee configure.log

      - name: Build plugin and Ikeback executables
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake --build build --parallel 4 --target \
            classroom \
            ikeback-master ikeback-configurator ikeback-cli ikeback-wcli \
            ikeback-service ikeback-server ikeback-worker 2>&1 | tee build.log

      # MANDATORY: without `windows-platform.dll` IkebackCore qFatal()s and every
      # Ikeback executable dies with __fastfail at startup.
      - name: Build mandatory Windows platform plugin
        shell: msys2 {0}
        run: |
          set -o pipefail
          if cmake --build build --parallel 4 --target windows-platform > windows-platform.log 2>&1; then
            cat windows-platform.log
            exit 0
          fi
          cat windows-platform.log
          grep -E "error:|undefined reference" windows-platform.log | head -9 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      - name: Build other upstream plugins (best effort)
        shell: msys2 {0}
        run: |
          set -o pipefail
          # `builtin-ultravnc-server` is the real target name (the directory is
          # called ultravnc-builtin). Without this plugin ikeback-server exits
          # with "no VNC server plugins found" and nothing can connect.
          for target in authkeys builtindirectory demo desktopservices ldap \
                        powercontrol remoteaccess screenlock screenshot \
                        systemusergroups textmessage usersessioncontrol \
                        external-vnc-server headless-vnc-server \
                        builtin-ultravnc-server vnchooks; do
            if cmake --build build --parallel 4 --target "$target" > /tmp/plugin-one.log 2>&1; then
              echo "built:   $target"
            else
              echo "skipped: $target"
              tail -n 12 /tmp/plugin-one.log || true
              if [ "$target" = "builtin-ultravnc-server" ]; then
                echo "::error::the VNC server plugin failed to build - ikeback-server cannot start without it"
                tail -n 8 /tmp/plugin-one.log | while IFS= read -r line; do echo "::error::vs|${line}"; done
                exit 1
              fi
            fi
          done

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrEmpty($v)) { $v = $env:GITHUB_REF_NAME -replace '^v', '' }
          if ([string]::IsNullOrEmpty($v)) { $v = '5.2.1' }
          "value=$v" >> $env:GITHUB_OUTPUT

      # A hand-written DLL whitelist produced installs that failed with
      # "libbz2-1.dll / libmd4c.dll not found". ntldd now walks the real PE
      # import closure so every required runtime DLL is shipped.
      # Compile the .ts sources into .qm so the installed UI is Chinese by
      # default (switchable in Configurator -> General -> Language).
      - name: Build Simplified Chinese translations
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p translations
          LRELEASE="$(command -v lrelease || command -v lrelease-qt6 || true)"
          if [ -z "$LRELEASE" ]; then
            LRELEASE="$(find /ucrt64/bin -maxdepth 1 -name 'lrelease*' -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$LRELEASE" ]; then echo 'lrelease not found' >&2; exit 1; fi
          "$LRELEASE" desktop/translations/ikeback_zh_CN.ts -qm translations/ikeback_zh_CN.qm
          find /ucrt64/share/qt6/translations -maxdepth 1 -name 'qt*_zh_CN.qm' -exec cp '{}' translations/ \; 2>/dev/null || true
          ls -lh translations

      - name: Assemble self-contained runtime payload
        shell: msys2 {0}
        run: bash desktop/scripts/collect-windows-runtime.sh

      - name: Build teacher and student setup EXEs
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist
          { printf '\xEF\xBB\xBF'; cat desktop/scripts/ikeback-installer.nsi; } > installer.nsi
          makensis -DVERSION='${{ steps.ver.outputs.value }}' -DROLE=teacher installer.nsi
          makensis -DVERSION='${{ steps.ver.outputs.value }}' -DROLE=student installer.nsi
          ls -lh dist

      - uses: actions/upload-artifact@v6
        with:
          name: ikeback-windows
          path: dist/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Package
  package:
    name: Assemble release artifacts
    needs: [android, windows]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: ikeback-android
          path: artifacts

      - uses: actions/download-artifact@v6
        with:
          name: ikeback-windows
          path: windows-setups

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrEmpty($v)) { $v = $env:GITHUB_REF_NAME -replace '^v', '' }
          if ([string]::IsNullOrEmpty($v)) { $v = '5.2.1' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Assemble the three artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.ver.outputs.value }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $apk = Get-ChildItem -LiteralPath 'artifacts' -Filter '*.apk' -File | Select-Object -First 1
          if (-not $apk) { throw 'Android APK artifact missing' }
          Copy-Item -LiteralPath $apk.FullName -Destination "dist/ikeback-Mobile-$v.apk" -Force

          $setups = @(Get-ChildItem -LiteralPath 'windows-setups' -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 2) { throw "Expected 2 setup EXEs, got $($setups.Count)" }
          foreach ($setup in $setups) {
            Copy-Item -LiteralPath $setup.FullName -Destination "dist/$($setup.Name)" -Force
          }

          $lines = Get-ChildItem -LiteralPath 'dist' -File |
            Where-Object { $_.Name -like 'ikeback-*' } |
            Sort-Object Name |
            ForEach-Object {
              ((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()) + '  ' + $_.Name
            }
          [IO.File]::WriteAllLines('dist/SHA256SUMS.txt', $lines, (New-Object Text.UTF8Encoding($false)))
          Get-ChildItem -LiteralPath 'dist' -File |
            Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Write release notes
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.value }}'
          $template = [IO.File]::ReadAllText('desktop/scripts/release-notes-template.md', [Text.Encoding]::UTF8)
          $notes = $template.Replace('{VER}', $v)
          [IO.File]::WriteAllText('dist/RELEASE-NOTES.md', $notes, (New-Object Text.UTF8Encoding($false)))

      - uses: actions/upload-artifact@v6
        with:
          name: ikeback-release-final
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------ Release
  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: ikeback-release-final
          path: dist

      - name: Verify all three artifacts and checksums
        shell: bash
        run: |
          set -e
          ls dist/ikeback-teacher-*-win64-setup.exe
          ls dist/ikeback-student-*-win64-setup.exe
          ls dist/ikeback-Mobile-*.apk
          ls dist/SHA256SUMS.txt
          cd dist
          while read -r hash file; do
            [ -z "$file" ] && continue
            echo "$hash  $file" | sha256sum -c -
          done < SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: ikeback ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          body_path: dist/RELEASE-NOTES.md
          files: |
            dist/ikeback-teacher-*-win64-setup.exe
            dist/ikeback-student-*-win64-setup.exe
            dist/ikeback-Mobile-*.apk
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
          fail_on_unmatched_files: true

      # 5.2.0 is the first official ikeback release. Opt-in so a normal publish
      # never deletes anything by accident - tick "purge_old_releases" when
      # dispatching the workflow.
      - name: Purge releases older than 5.2.0
        if: github.event.inputs.purge_old_releases == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cutoff = [version]'5.2.0'
          $tags = gh release list --limit 200 --json tagName --jq '.[].tagName'
          foreach ($tag in $tags) {
            if ([string]::IsNullOrWhiteSpace($tag)) { continue }
            $clean = ($tag -replace '^v', '') -replace '[-+].*$', ''
            if ($clean -notmatch '^\d+(\.\d+){1,3}$') {
              Write-Host "skip $tag (not a numeric version)"
              continue
            }
            if ([version]$clean -lt $cutoff) {
              Write-Host "deleting release $tag"
              gh release delete $tag --cleanup-tag --yes
            } else {
              Write-Host "keep $tag"
            }
          }
